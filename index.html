<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข่าวประชาสัมพันธ์ เทศบาลตำบลหัวดง</title>
    
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- นำเข้า React และ ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- นำเข้า Babel สำหรับแปลง JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts (Optional: เพื่อความสวยงามเหมือนในตัวอย่าง) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
        }
        
        /* Custom Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .animate-slideUp {
            animation: slideUp 0.3s ease-out forwards;
        }

        /* Hide Scrollbar */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-yellow-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        // --- ส่วนประกอบไอคอน (SVG Components) ---
        // สร้างไอคอนขึ้นมาเองเพื่อให้ใช้งานได้โดยไม่ต้อง Import library
        const IconBase = ({ size = 24, className = "", children }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const Calendar = (props) => (
            <IconBase {...props}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></IconBase>
        );
        const ChevronRight = (props) => (
            <IconBase {...props}><polyline points="9 18 15 12 9 6"/></IconBase>
        );
        const ChevronLeft = (props) => (
            <IconBase {...props}><polyline points="15 18 9 12 15 6"/></IconBase>
        );
        const X = (props) => (
            <IconBase {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>
        );
        const ImageIcon = (props) => (
            <IconBase {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></IconBase>
        );
        const Share2 = (props) => (
            <IconBase {...props}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></IconBase>
        );
        const Eye = (props) => (
            <IconBase {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></IconBase>
        );
        const ZoomIn = (props) => (
            <IconBase {...props}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></IconBase>
        );
        const Smile = (props) => (
            <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></IconBase>
        );
        const ExternalLink = (props) => (
            <IconBase {...props}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></IconBase>
        );

        // --- Main Component ---
        const NewsDashboard = () => {
            // ข้อมูลข่าวสาร
            const newsData = [
                {
                    id: 2,
                    title: "รับสมัครเด็กเล็ก ปีการศึกษา 2569",
                    date: "20 กุมภาพันธ์ 2569",
                    views: 45,
                    author: "แอดมินระบบ",
                    content: "รับสมัครเด็กเล็กเพื่อเข้าเรียนในศูนย์พัฒนาเด็กเล็กเทศบาลตำบลหัวดง ประจำปีการศึกษา 2569\n\n• วันรับสมัคร: บัดนี้จนถึงวันที่ 31 มีนาคม 2569\n• มอบตัว: ในวันที่ 1 เมษายน 2569 (เวลา 08.00 น. เป็นต้นไป)\n• เปิดเรียน: วันจันทร์ที่ 18 พฤษภาคม 2569",
                    images: [],
                    link: "https://drive.google.com/drive/folders/1jz4szFjJlX1HelKRmwJ1NhLqJtaV3wpB?usp=sharing"
                },
                {
                    id: 1,
                    title: "รับการตรวจเยี่ยม ประเมินผล ห้องเรียนปลอดฝุ่น",
                    date: "19 ธันวาคม 2568",
                    views: 128,
                    author: "แอดมินระบบ",
                    content: "วันศุกร์ที่ 19 ธันวาคม 2568 ศูนย์พัฒนาเด็กเล็กเทศบาลตำบลหัวดงพร้อมด้วยนางพวงพรรณ ขันปิงปุ๊ด ปลัดเทศบาล พนักงานกองการศึกษาและกองสาธารสุข รับการตรวจเยี่ยมและประเมินผลห้องเรียนปลอดฝุ่น จากศูนย์อนามัยที่ 2 พิษณุโลก ร่วมกับสาธารณสุขจังหวัดอุตรดิตถ์ สาธารณสุขอำเภอลับแล และโรงพยาบาลส่งเสริมสุขภาพตำบลแม่พูล โดยศูนย์พัฒนาเด็กเล็กเทศบาลตำบลหัวดงได้รับเลือกเป็นตัวแทนระดับจังหวัดในการขับเคลื่อนการดำเนินการห้องเรียนปลอดฝุ่น เพื่อสร้างพื้นที่ปลอดภัยและส่งเสริมสุขภาพที่ดีให้กับเด็กเล็กในความดูแล",
                    images: [
                        "https://res.cloudinary.com/dygneumft/image/upload/v1766368570/%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%A8%E0%B8%B6%E0%B8%81%E0%B8%A9%E0%B8%B2/1.%20%E0%B8%95%E0%B8%A3%E0%B8%A7%E0%B8%88%E0%B9%80%E0%B8%A2%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%A1%E0%B8%AB%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B8%9B%E0%B8%A5%E0%B8%AD%E0%B8%94%E0%B8%9D%E0%B8%B8%E0%B9%88%E0%B8%99/1_luteht.jpg",
                        "https://res.cloudinary.com/dygneumft/image/upload/v1766368570/%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%A8%E0%B8%B6%E0%B8%81%E0%B8%A9%E0%B8%B2/1.%20%E0%B8%95%E0%B8%A3%E0%B8%A7%E0%B8%88%E0%B9%80%E0%B8%A2%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%A1%E0%B8%AB%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B8%9B%E0%B8%A5%E0%B8%AD%E0%B8%94%E0%B8%9D%E0%B8%B8%E0%B9%88%E0%B8%99/2_ahacz1.jpg",
                        "https://res.cloudinary.com/dygneumft/image/upload/v1766368570/%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%A8%E0%B8%B6%E0%B8%81%E0%B8%A9%E0%B8%B2/1.%20%E0%B8%95%E0%B8%A3%E0%B8%A7%E0%B8%88%E0%B9%80%E0%B8%A2%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%A1%E0%B8%AB%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B8%9B%E0%B8%A5%E0%B8%AD%E0%B8%94%E0%B8%9D%E0%B8%B8%E0%B9%88%E0%B8%99/3_glzz4i.jpg",
                        "https://res.cloudinary.com/dygneumft/image/upload/v1766368571/%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%A8%E0%B8%B6%E0%B8%81%E0%B8%A9%E0%B8%B2/1.%20%E0%B8%95%E0%B8%A3%E0%B8%A7%E0%B8%88%E0%B9%80%E0%B8%A2%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%A1%E0%B8%AB%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B8%9B%E0%B8%A5%E0%B8%AD%E0%B8%94%E0%B8%9D%E0%B8%B8%E0%B9%88%E0%B8%99/4_qswitd.jpg",
                        "https://res.cloudinary.com/dygneumft/image/upload/v1766368571/%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%A8%E0%B8%B6%E0%B8%81%E0%B8%A9%E0%B8%B2/1.%20%E0%B8%95%E0%B8%A3%E0%B8%A7%E0%B8%88%E0%B9%80%E0%B8%A2%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%A1%E0%B8%AB%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B8%9B%E0%B8%A5%E0%B8%AD%E0%B8%94%E0%B8%9D%E0%B8%B8%E0%B9%88%E0%B8%99/7_crrmcu.jpg",
                        "https://res.cloudinary.com/dygneumft/image/upload/v1766368570/%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%A8%E0%B8%B6%E0%B8%81%E0%B8%A9%E0%B8%B2/1.%20%E0%B8%95%E0%B8%A3%E0%B8%A7%E0%B8%88%E0%B9%80%E0%B8%A2%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%A1%E0%B8%AB%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B8%9B%E0%B8%A5%E0%B8%AD%E0%B8%94%E0%B8%9D%E0%B8%B8%E0%B9%88%E0%B8%99/9_gh3db9.jpg",
                        "https://res.cloudinary.com/dygneumft/image/upload/v1766368570/%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%A8%E0%B8%B6%E0%B8%81%E0%B8%A9%E0%B8%B2/1.%20%E0%B8%95%E0%B8%A3%E0%B8%A7%E0%B8%88%E0%B9%80%E0%B8%A2%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%A1%E0%B8%AB%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B8%9B%E0%B8%A5%E0%B8%AD%E0%B8%94%E0%B8%9D%E0%B8%B8%E0%B9%88%E0%B8%99/10_qove4q.jpg",
                        "https://res.cloudinary.com/dygneumft/image/upload/v1766368571/%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%A8%E0%B8%B6%E0%B8%81%E0%B8%A9%E0%B8%B2/1.%20%E0%B8%95%E0%B8%A3%E0%B8%A7%E0%B8%88%E0%B9%80%E0%B8%A2%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%A1%E0%B8%AB%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B8%9B%E0%B8%A5%E0%B8%AD%E0%B8%94%E0%B8%9D%E0%B8%B8%E0%B9%88%E0%B8%99/11_pg9htm.jpg"
                    ]
                }
            ];

            const [selectedNews, setSelectedNews] = useState(null);
            const [lightboxImage, setLightboxImage] = useState(null);
            const galleryRef = useRef(null);
            
            const openNews = (news) => {
                setSelectedNews(news);
                window.scrollTo(0, 0); 
            };

            const closeNews = () => {
                setSelectedNews(null);
            };

            const openLightbox = (imgUrl) => {
                setLightboxImage(imgUrl);
            };

            const closeLightbox = () => {
                setLightboxImage(null);
            };

            const scrollGallery = (direction) => {
                if (galleryRef.current) {
                    // คำนวณระยะเลื่อนตามความกว้างหน้าจอ (ประมาณ 85% ของจอ)
                    const scrollAmount = window.innerWidth * 0.85; 
                    if (direction === 'left') {
                        galleryRef.current.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    } else {
                        galleryRef.current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    }
                }
            };

            return (
                <div className="min-h-screen bg-yellow-50 font-sans pb-10">
                
                    {/* Container หลัก */}
                    <div className="w-full max-w-md mx-auto bg-white min-h-screen shadow-2xl overflow-hidden border-x-4 border-orange-200">

                        {/* Header ตกแต่ง */}
                        <div className="h-3 bg-gradient-to-r from-pink-300 via-yellow-300 to-sky-300"></div>

                        {/* Main Content Area */}
                        <main className="px-4 py-6">
                        
                            {/* News Feed List */}
                            {!selectedNews ? (
                                <div className="space-y-6 animate-fadeIn">
                                    <div className="grid grid-cols-1 gap-5">
                                        {newsData.map((news) => (
                                            <div 
                                                key={news.id}
                                                onClick={() => openNews(news)}
                                                className="bg-white rounded-3xl shadow-[0_4px_0_0_rgba(0,0,0,0.05)] border-2 border-sky-100 hover:border-pink-300 transition-all duration-200 overflow-hidden cursor-pointer group active:scale-[0.98] active:shadow-none translate-y-0 hover:-translate-y-1"
                                            >
                                                <div className="p-5">
                                                    {/* Date & Views Pill */}
                                                    <div className="flex gap-2 mb-3">
                                                        <span className="bg-sky-100 text-sky-600 text-[10px] px-2 py-1 rounded-full font-bold flex items-center">
                                                            <Calendar size={10} className="mr-1" />
                                                            {news.date}
                                                        </span>
                                                        <span className="bg-pink-100 text-pink-500 text-[10px] px-2 py-1 rounded-full font-bold flex items-center">
                                                            <Eye size={10} className="mr-1" />
                                                            {news.views}
                                                        </span>
                                                    </div>
                                                    
                                                    <h3 className="text-lg font-bold text-slate-700 mb-4 line-clamp-2 leading-snug group-hover:text-pink-500 transition-colors">
                                                        {news.title}
                                                    </h3>
                                                    
                                                    <div className="flex items-center justify-between pt-2">
                                                        <div className="flex items-center gap-1">
                                                            <div className="w-6 h-6 rounded-full bg-yellow-200 flex items-center justify-center text-yellow-600">
                                                                <span className="text-xs font-bold">A</span>
                                                            </div>
                                                            <span className="text-xs text-slate-400 font-medium ml-1">
                                                                {news.author}
                                                            </span>
                                                        </div>
                                                        <button className="bg-sky-400 hover:bg-sky-500 text-white text-xs font-bold py-2 px-4 rounded-full flex items-center shadow-sm transition-colors">
                                                            อ่านเลย <ChevronRight size={14} className="ml-1" />
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                /* Detailed View */
                                <div className="animate-slideUp bg-white pb-20">
                                    
                                    {/* Action Bar */}
                                    <div className="sticky top-0 bg-white/95 backdrop-blur-md z-20 -mx-4 px-4 py-3 border-b-2 border-dashed border-orange-100 flex justify-between items-center mb-4">
                                        <button 
                                            onClick={closeNews}
                                            className="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center text-pink-500 active:bg-pink-200 transition-colors border-2 border-pink-200"
                                        >
                                            <X size={20} strokeWidth={3} />
                                        </button>
                                        <div className="flex gap-2">
                                            <button className="w-10 h-10 rounded-full bg-sky-100 flex items-center justify-center text-sky-500 active:bg-sky-200 border-2 border-sky-200">
                                                <Share2 size={18} strokeWidth={2.5} />
                                            </button>
                                        </div>
                                    </div>

                                    <div className="">
                                        
                                        {/* Header Info */}
                                        <div className="flex items-center gap-2 mb-4">
                                            <span className="px-3 py-1 bg-pink-400 text-white text-xs font-bold rounded-full shadow-sm transform -rotate-2">
                                                ข่าวประชาสัมพันธ์
                                            </span>
                                            <span className="bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full text-xs flex items-center font-bold">
                                                <Calendar size={12} className="mr-1" /> {selectedNews.date}
                                            </span>
                                        </div>

                                        <h1 className="text-2xl font-bold text-slate-800 mb-6 leading-relaxed font-sans">
                                            {selectedNews.title}
                                        </h1>

                                        {/* Content Box */}
                                        <div className="bg-sky-50 p-6 rounded-3xl border-2 border-sky-100 mb-8 relative">
                                            {/* Decorative Elements */}
                                            <div className="absolute top-0 right-0 -mt-2 -mr-2 w-6 h-6 bg-yellow-300 rounded-full opacity-50"></div>
                                            <div className="absolute bottom-0 left-0 -mb-2 -ml-2 w-4 h-4 bg-pink-300 rounded-full opacity-50"></div>
                                            
                                            <p className="text-slate-600 leading-7 text-base whitespace-pre-line font-medium">
                                                {selectedNews.content}
                                            </p>
                                            <div className="mt-6 flex items-center gap-2 pt-4 border-t border-sky-100">
                                                <div className="w-8 h-8 rounded-full bg-orange-200 flex items-center justify-center">
                                                    <Smile size={18} className="text-orange-600" />
                                                </div>
                                                <div className="text-sm text-slate-500 font-bold">
                                                    โพสต์โดย: <span className="text-orange-500">{selectedNews.author}</span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Link Section สำหรับข่าวที่มีลิงก์เพิ่มเติม */}
                                        {selectedNews.link && (
                                            <div className="mb-8 p-5 bg-orange-50 rounded-3xl border-2 border-orange-200 border-dashed flex flex-col items-center text-center mx-2">
                                                <p className="text-slate-700 font-bold mb-3">ดูรายละเอียดเพิ่มเติม / ดาวน์โหลดเอกสาร</p>
                                                <a 
                                                    href={selectedNews.link} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer" 
                                                    className="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-full font-bold flex items-center shadow-lg transition-transform hover:-translate-y-1 active:scale-95"
                                                >
                                                    คลิกดูรายละเอียด <ExternalLink size={18} className="ml-2" />
                                                </a>
                                            </div>
                                        )}

                                        {/* Scrollable Image Gallery */}
                                        {selectedNews.images && selectedNews.images.length > 0 && (
                                            <div className="mt-8 relative -mx-4 px-4">
                                                <div className="flex items-center justify-between mb-4 px-2">
                                                    <h3 className="font-bold text-slate-700 flex items-center text-lg">
                                                        <span className="bg-green-100 p-1.5 rounded-lg mr-2 text-green-600">
                                                            <ImageIcon size={20} strokeWidth={2.5} />
                                                        </span>
                                                        ภาพกิจกรรม
                                                    </h3>
                                                    <span className="text-xs bg-slate-100 text-slate-400 px-2 py-1 rounded-full">แตะเพื่อขยาย</span>
                                                </div>
                                                
                                                {/* Container for Gallery + Buttons */}
                                                <div className="relative group">
                                                    {/* Left Button */}
                                                    <button 
                                                        onClick={() => scrollGallery('left')}
                                                        className="absolute left-3 top-1/2 -translate-y-1/2 z-10 bg-white p-2 rounded-full shadow-lg text-orange-400 border-2 border-orange-100 active:scale-95 hidden md:block hover:bg-orange-50"
                                                    >
                                                        <ChevronLeft size={24} strokeWidth={3} />
                                                    </button>

                                                    {/* Scroll Area */}
                                                    <div 
                                                        ref={galleryRef}
                                                        className="flex overflow-x-auto gap-4 pb-6 snap-x hide-scrollbar scroll-smooth px-2"
                                                    >
                                                        {selectedNews.images.map((img, index) => (
                                                            <div 
                                                                key={index} 
                                                                className="flex-none w-[85vw] max-w-sm aspect-video relative rounded-3xl overflow-hidden shadow-md snap-center cursor-pointer border-4 border-white hover:scale-[1.02] transition-transform duration-300 ring-4 ring-transparent hover:ring-yellow-200"
                                                                onClick={() => openLightbox(img)}
                                                            >
                                                                <img 
                                                                    src={img} 
                                                                    alt={`Gallery ${index}`} 
                                                                    className="w-full h-full object-cover"
                                                                />
                                                                <div className="absolute bottom-3 right-3">
                                                                    <div className="bg-white/80 backdrop-blur-sm text-slate-700 p-1.5 rounded-full shadow-sm">
                                                                        <ZoomIn size={18} />
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>

                                                    {/* Right Button */}
                                                    <button 
                                                        onClick={() => scrollGallery('right')}
                                                        className="absolute right-3 top-1/2 -translate-y-1/2 z-10 bg-white p-2 rounded-full shadow-lg text-orange-400 border-2 border-orange-100 active:scale-95 hidden md:block hover:bg-orange-50"
                                                    >
                                                        <ChevronRight size={24} strokeWidth={3} />
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    {/* Lightbox Modal */}
                    {lightboxImage && (
                        <div 
                            className="fixed inset-0 z-50 bg-slate-900/95 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn"
                            onClick={closeLightbox}
                        >
                            <button 
                                onClick={closeLightbox}
                                className="absolute top-4 right-4 text-white hover:text-pink-300 z-50 p-2 bg-white/20 rounded-full transition-colors"
                            >
                                <X size={28} strokeWidth={3} />
                            </button>
                            
                            <img 
                                src={lightboxImage} 
                                alt="Full size" 
                                className="max-w-full max-h-[90vh] object-contain rounded-2xl shadow-2xl border-4 border-white"
                                onClick={(e) => e.stopPropagation()} 
                            />
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NewsDashboard />);
    </script>
</body>
</html>
